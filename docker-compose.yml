services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bizintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizintel_app
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: bizintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizintel_app -d bizintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizintel-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bizintel_app:change-me@db:5432/bizintel
      APP_NAME: BizIntel AI
      ENVIRONMENT: production
    ports:
      - "8000:8000"

volumes:
  pgdata:
